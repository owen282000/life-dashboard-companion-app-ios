<!DOCTYPE html>
<!--
  Source for docs/readme-icon.png, the icon at the top of the README: the Liquid Glass app icon as
  iOS draws it (docs/brand/app-icon.png, exported from AppIcon.icon with ictool, see app-icon.html),
  which brings its own rounded shape and glass edge, on a transparent background so it sits on
  GitHub's light and dark theme alike.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=docs/readme-icon.png --window-size=512,512 \
      --hide-scrollbars --force-device-scale-factor=1 \
      --default-background-color=00000000 docs/brand/readme-icon.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  .icon { position: absolute; inset: 16px; }
  .icon img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="icon"><img src="app-icon.png" alt=""></div>
</body>
</html>
