<!DOCTYPE html>
<!--
  The heartbeat mark on its dark ground, flat: the same mark and ground as the Android app's
  store icon (life-dashboard-companion-app, docs/brand/icon.html), so both apps carry one
  identity. The in-app mark (BrandMark in Screens/Brand.swift) draws the same paths.

  This file is the source of the mark, not of the app icon itself. The app icon is the
  Icon Composer document LifeDashboardCompanion/AppIcon.icon:

    icon.json            the background fill (#171D21 to #101C1C, deeper in dark mode), the
                         groups and their Liquid Glass settings
    Assets/pulse.svg     the pulse with its endpoint dot, the front group
    Assets/arc-inner.svg the two signal arcs, the group behind it, at 85 and 50 percent
    Assets/arc-outer.svg

  The SVG layers are written from the points below by app-icon-layers.swift (run it after
  changing the mark here). Open AppIcon.icon in Icon Composer (Xcode > Open Developer Tool) to
  preview or tune the glass. Xcode compiles it into the dark, clear and tinted appearances of
  iOS 26 and later, and into flat icons for iOS 17 and 18. Preview a rendition without Xcode:

    ICTOOL="/Applications/Xcode.app/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
    "$ICTOOL" LifeDashboardCompanion/AppIcon.icon --export-image --output-file /tmp/icon.png \
      --platform iOS --rendition Default --width 1024 --height 1024 --scale 1
    # renditions: Default, Dark, ClearLight, ClearDark, TintedLight, TintedDark

  This page renders docs/brand/app-icon.png, the flat icon that readme-icon.html frames, at
  1024 px with headless Chrome, from the repository root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=512,512 --force-device-scale-factor=2 \
      --screenshot=docs/brand/app-icon.png "file://$PWD/docs/brand/app-icon.html"

  Colours: background #171D21 -> #14181C -> #101C1C, heartbeat green #30B77E.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background: radial-gradient(120% 120% at 30% 25%, #171D21 0%, #14181C 45%, #101C1C 100%);
    position: relative;
  }
  /* Subtle dashboard grid, bottom-right, like the banner */
  .grid {
    position: absolute; right: 0; bottom: 0; width: 60%; height: 55%;
    background-image:
      linear-gradient(to right, rgba(48,183,126,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(48,183,126,0.07) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(100% 100% at 100% 100%, black 30%, transparent 75%);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="grid"></div>
  <svg width="512" height="512" viewBox="0 0 512 512">
    <defs>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="14" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <!-- Heartbeat broadcast: pulse, endpoint dot, and two arcs radiating the signal.
         The pulse is measured AND published, which is exactly what the app does. -->
    <g filter="url(#glow)">
      <path class="mark" d="M64 256 L158 256 L186 176 L232 340 L264 232 L290 256 L330 256"
            fill="none" stroke="#30B77E" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="mark" cx="330" cy="256" r="20" fill="#30B77E" stroke="none"/>
      <path class="mark" d="M376 216 A 60 60 0 0 1 376 296" fill="none" stroke="#30B77E"
            stroke-width="20" stroke-linecap="round" opacity="0.85"/>
      <path class="mark" d="M410 186 A 105 105 0 0 1 410 326" fill="none" stroke="#30B77E"
            stroke-width="20" stroke-linecap="round" opacity="0.5"/>
    </g>
  </svg>
</body>
</html>
