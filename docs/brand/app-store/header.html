<!DOCTYPE html>
<!--
  Source for the App Store product page header and the search results asset, in the
  panorama's style (panorama.html): the same ground, grid, heartbeat line, phones and cards.
  The size comes from the query string; render.sh renders all three:

    header.html?size=5244x2950   header-5244x2950.png  header, 16:9 (can double as search asset)
    header.html?size=3840x1646   header-3840x1646.png  header, wide
    header.html?size=3840x2560   search-3840x2560.png  search results, 3:2

  One idea each, as Apple's guidance asks: the header says where the data can go (your own
  server: Home Assistant, MQTT or webhooks) with two phones and one card; the search asset
  states the purpose in one line next to one phone. Laid out 2950 design pixels high and
  scaled to the real height. Everything that matters stays inside a margin of 6 percent on
  every edge, and the headline stays legible with the header about 600 px wide and the search
  asset about 350 px wide.

  Phone screens are real captures from raw/ (scripts/store-screenshots.sh). No prices, URLs,
  copyright signs, other platforms or stores, competitor names, Apple logos or recognitions.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #0C1714; }
  #stage {
    position: absolute; left: 0; top: 0; height: 2950px; overflow: hidden; transform-origin: 0 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(48,183,126,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,183,126,0.055) 1px, transparent 1px);
    background-size: 88px 88px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, black 45%, rgba(0,0,0,0.5) 100%);
  }
  svg.pulse { position: absolute; left: 0; top: 0; }

  .text { position: absolute; }
  .brand { display: flex; align-items: center; gap: 36px; margin-bottom: 90px; }
  .brand img { width: 170px; height: 170px; border-radius: 40px; box-shadow: 0 30px 70px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.1); }
  .brand b { display: block; font-size: 66px; font-weight: 800; letter-spacing: -1px; }
  .brand span { display: block; margin-top: 4px; font-size: 46px; color: #AFC0BA; }
  .text h1 {
    font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; white-space: nowrap;
    text-shadow: 0 8px 50px rgba(0,0,0,0.45);
  }
  .text h1 em {
    font-style: normal;
    background: linear-gradient(90deg, #5BE3A6, #30B77E);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .text p { margin-top: 80px; line-height: 1.3; color: #B2C2BC; }
  .chips { display: flex; gap: 0.5em; margin-top: 1em; }
  .text.center { text-align: center; }
  .text.center .chips { justify-content: center; margin-top: 1.1em; }
  .chips span {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45em; min-width: 6.6em;
    padding: 0.5em 0.9em; border-radius: 999px; white-space: nowrap; font-size: 1em; font-weight: 700;
    color: #EAF3EF; background: rgba(18,32,28,0.92); border: 3px solid rgba(48,183,126,0.5);
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  .chips i { width: 0.36em; height: 0.36em; border-radius: 50%; background: #30B77E; display: inline-block; }

  .phone { position: absolute; transform-origin: 50% 40%; }
  .phone .body {
    position: relative; width: 100%; height: 100%; border-radius: var(--r);
    background: linear-gradient(135deg, #5A6268 0%, #2A2F33 22%, #1A1D20 50%, #2E3438 78%, #5B6369 100%);
    padding: var(--band);
    box-shadow: 0 70px 140px rgba(0,0,0,0.6), 0 24px 60px rgba(0,0,0,0.5), 0 0 180px rgba(48,183,126,0.18);
  }
  .phone .bezel { width: 100%; height: 100%; border-radius: calc(var(--r) - var(--band)); background: #000; padding: var(--bezel); }
  .phone .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background-size: 100% 100%; background-repeat: no-repeat;
  }
  .phone .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 999px; }
  .phone .btn { position: absolute; width: 9px; border-radius: 4px; background: linear-gradient(90deg, #22272A, #5A6268); }
  .phone .glare {
    position: absolute; inset: 0; border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background: linear-gradient(115deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 32%);
  }
  .phone.back .screen::after { content: ""; position: absolute; inset: 0; background: rgba(5,12,10,0.28); }

  .float { position: absolute; }
  .float .frame {
    border-radius: 38px; overflow: hidden; background: #1C1C1E;
    border: 2px solid rgba(255,255,255,0.14);
    box-shadow: 0 50px 110px rgba(0,0,0,0.6), 0 0 0 12px rgba(0,0,0,0.12);
  }
  .float .label {
    display: inline-flex; align-items: center; gap: 16px; margin-bottom: 20px;
    padding: 16px 30px; border-radius: 999px; white-space: nowrap;
    font-size: 40px; font-weight: 700; color: #DDE7E3;
    background: rgba(10,18,16,0.86); border: 2px solid rgba(255,255,255,0.14);
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  .float .label i { width: 20px; height: 20px; border-radius: 50%; background: var(--dot, #41BDF5); display: inline-block; }
  .crop { background-repeat: no-repeat; }

  .badge {
    position: absolute; display: flex; align-items: center; gap: 30px;
    padding: 36px 56px 36px 40px; border-radius: 999px; white-space: nowrap;
    background: linear-gradient(135deg, rgba(48,183,126,0.96), rgba(32,140,95,0.96));
    color: #04140D; box-shadow: 0 40px 90px rgba(0,0,0,0.55), 0 0 100px rgba(48,183,126,0.45);
  }
  .badge b { display: block; font-size: 70px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .badge small { display: block; margin-top: 10px; font-size: 38px; font-weight: 600; opacity: 0.8; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <svg class="pulse" id="pulse" height="2950"><path id="beat" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="items"></div>
</div>

<script>
const [W, H] = (new URLSearchParams(location.search).get("size") || "5244x2950").split("x").map(Number);
const D = 2950, DW = Math.round(W * D / H), s = H / D;
const LANG = new URLSearchParams(location.search).get("lang") || "en";
const RAW = LANG === "en" ? "raw/" : `raw/${LANG}/`, HA = "ha/";
// The words per language; nl and de follow docs/localization.md ("je", "du").
const T = {
  en: { wide: "Health data to<br>Home Assistant<br><em>or your own server</em>", sub: "No account, no cloud in between.", head: "Your health data,<br><em>on your own server</em>", signed: "Signed" },
  nl: { wide: "Gezondheidsdata naar<br>Home Assistant<br><em>of je eigen server</em>", sub: "Geen account, geen cloud ertussen.", head: "Je gezondheidsdata,<br><em>op je eigen server</em>", signed: "Ondertekend" },
  de: { wide: "Gesundheitsdaten an<br>Home Assistant<br><em>oder deinen Server</em>", sub: "Kein Konto, keine Cloud dazwischen.", head: "Deine Gesundheitsdaten,<br><em>auf deinem Server</em>", signed: "Signiert", scale: 0.86 },
}[LANG];
// The safe area: 6 percent in from every edge, in design pixels.
const MX = Math.round(DW * 0.06), MY = Math.round(D * 0.06);

document.documentElement.style.width = document.body.style.width = W + "px";
document.documentElement.style.height = document.body.style.height = H + "px";
const stage = document.getElementById("stage");
stage.style.width = DW + "px";
stage.style.transform = `scale(${s})`;
stage.style.background = [
  `radial-gradient(1700px 1500px at ${Math.round(DW * 0.74)}px 1500px, rgba(48,183,126,0.20), transparent 70%)`,
  `radial-gradient(1500px 1100px at ${Math.round(DW * 0.18)}px 1300px, rgba(48,183,126,0.08), transparent 70%)`,
  `radial-gradient(1000px 900px at ${Math.round(DW * 0.9)}px 2300px, rgba(70,140,255,0.08), transparent 70%)`,
  `linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%)`,
  `linear-gradient(90deg, #11221D 0%, #0E1B18 35%, #101C1C 65%, #0F1D19 100%)`,
].join(",");

// The heartbeat, low across the whole width, with one beat under the text.
(function () {
  const svg = document.getElementById("pulse");
  svg.setAttribute("width", DW);
  svg.setAttribute("viewBox", `0 0 ${DW} ${D}`);
  const y = 2330, beats = [Math.round(DW * 0.36)];
  let d = `M -20 ${y}`;
  for (const x of beats) d += ` L ${x - 150} ${y} L ${x - 100} ${y - 170} L ${x - 25} ${y + 240} L ${x + 40} ${y - 80} L ${x + 90} ${y}`;
  d += ` L ${DW + 20} ${y}`;
  const beat = document.getElementById("beat");
  beat.setAttribute("d", d);
  beat.setAttribute("stroke", "url(#fade)");
  svg.insertAdjacentHTML("afterbegin", `<defs>
    <filter id="glow" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#30B77E" stop-opacity="0.12"/><stop offset="0.4" stop-color="#30B77E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#30B77E" stop-opacity="0.18"/></linearGradient></defs>`);
  beat.setAttribute("filter", "url(#glow)");
})();

function phone(src, x, y, w, transform = "", z = 2, cls = "") {
  const band = Math.round(w * 0.016), bezel = Math.round(w * 0.022);
  const sw = w - 2 * band - 2 * bezel, sh = Math.round(sw * 2868 / 1320);
  const h = sh + 2 * band + 2 * bezel, r = Math.round(w * 0.15), k = sw / 1320;
  const island = `<div class="island" style="top:${Math.round(33 * k)}px;width:${Math.round(378 * k)}px;height:${Math.round(111 * k)}px"></div>`;
  const btns = `<div class="btn" style="left:-7px;top:${Math.round(h * 0.2)}px;height:${Math.round(h * 0.04)}px"></div>` +
    `<div class="btn" style="left:-7px;top:${Math.round(h * 0.27)}px;height:${Math.round(h * 0.075)}px"></div>` +
    `<div class="btn" style="left:-7px;top:${Math.round(h * 0.37)}px;height:${Math.round(h * 0.075)}px"></div>` +
    `<div class="btn" style="right:-7px;top:${Math.round(h * 0.3)}px;height:${Math.round(h * 0.11)}px"></div>`;
  return `<div class="phone ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:${transform};z-index:${z};` +
    `--r:${r}px;--band:${band}px;--bezel:${bezel}px">${btns}<div class="body"><div class="bezel">` +
    `<div class="screen" style="background-image:url(${src})">${island}<div class="glare"></div></div></div></div></div>`;
}
function crop(src, srcW, rect, width) {
  const [x, y, w, h] = rect, k = width / w;
  return `<div class="crop" style="width:${width}px;height:${Math.round(h * k)}px;background-image:url(${src});` +
    `background-size:${Math.round(srcW * k)}px auto;background-position:${-Math.round(x * k)}px ${-Math.round(y * k)}px"></div>`;
}
function float(html, x, y, { label, dot, rotate = 0, z = 6 } = {}) {
  return `<div class="float" style="left:${x}px;top:${y}px;transform:rotate(${rotate}deg);z-index:${z};${dot ? `--dot:${dot}` : ""}">` +
    (label ? `<div class="label"><i></i>${label}</div>` : "") + `<div class="frame">${html}</div></div>`;
}
const tilt = (rz, ry = 0) => `perspective(3600px) rotateY(${ry}deg) rotate(${rz}deg)`;
const shield = `<svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#04140D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.3 12.2l2.6 2.6 4.9-5.2"/></svg>`;

// Search (3:2): one short, obvious line and one phone. Header (16:9 and wider): the broad
// idea, the three ways out, two phones and one card. The wider a banner, the smaller it is
// shown for the same width, so its headline is larger.
const search = DW / D < 1.6, wide = DW / D > 2;
const items = [];
const chips = `<div class="chips">` + ["Home Assistant", "MQTT", "Webhooks"].map(t => `<span><i></i>${t}</span>`).join("") + `</div>`;
if (search) {
  items.push(`<div class="text" style="left:${MX + 30}px;top:0;height:${D}px;display:flex;flex-direction:column;justify-content:center">` +
    `<h1 style="font-size:270px">${T.wide}</h1>` +
    `<p style="font-size:104px">${T.sub}</p></div>`);
  const right = DW - MX - 40, pw = 1000;
  items.push(phone(RAW + "health.png", right - pw, 360, pw, tilt(-4, -8), 4));
} else {
  // The product page crops the header: an iPhone shows about the middle half of the width,
  // and every device only the top 58 percent above the app's name card; on iPad a navigation
  // pill floats over the top 12 percent. So the headline is centred in the band from 25 to
  // 55 percent of the height and the middle half of the width, the chips sit small right
  // under it, and the phones are decoration at the sides, free to be cropped.
  const h1 = Math.round((wide ? 270 : 230) * (T.scale || 1)), sub = wide ? 68 : 62, cx = DW / 2;
  items.push(`<div style="position:absolute;left:${cx - 1500}px;top:300px;width:3000px;height:1700px;` +
    `background:radial-gradient(closest-side, rgba(48,183,126,0.16), transparent);z-index:1"></div>`);
  items.push(`<div class="text center" style="left:${cx - DW * 0.25}px;width:${DW * 0.5}px;top:${Math.round(D * (wide ? 0.27 : 0.285))}px;z-index:8">` +
    `<h1 style="font-size:${h1}px">${T.head}</h1>` +
    `<div style="font-size:${sub}px">${chips}</div></div>`);
  const pw = 1000, side = Math.round(DW * (wide ? 0.13 : 0.06));
  items.push(phone(RAW + "logs.png", side, 430, pw, tilt(9, 16), 3, "back"));
  items.push(phone(RAW + "health.png", DW - side - pw, 430, pw, tilt(-9, -16), 3, "back"));
  items.push(`<div class="badge" style="left:${DW - side - pw + 110}px;top:1480px;transform:rotate(-5deg);z-index:7">${shield}<div><b>${T.signed}</b><small>HMAC-SHA256</small></div></div>`);
}

document.getElementById("items").innerHTML = items.join("");
</script>
</body>
</html>
