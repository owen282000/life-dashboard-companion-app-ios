<!DOCTYPE html>
<!--
  Source for the App Store product page header and the search results asset, in the
  panorama's style (panorama.html): the same ground, font, heartbeat line, phones and pills.
  The size comes from the query string; render.sh renders all three into store-assets/:

    header.html?size=5244x2950   header-5244x2950.png  header, 16:9 (can double as search asset)
    header.html?size=3840x1646   header-3840x1646.png  header, wide
    header.html?size=3840x2560   search-3840x2560.png  search results, 3:2

  One idea each, as Apple's guidance asks: the header says where the data can go (your own
  server: Home Assistant, MQTT or webhooks) with two phones and one card; the search asset
  states the purpose in one line next to one phone. Laid out 2950 design pixels high and
  scaled to the real height. Everything that matters stays inside a margin of 6 percent on
  every edge, and the headline stays legible with the header about 600 px wide and the search
  asset about 350 px wide.

  Phone screens are real captures from store-assets/raw/ (scripts/store-screenshots.sh). No prices, URLs,
  copyright signs, other platforms or stores, competitor names, Apple logos or recognitions.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 400; src: url(../../../LifeDashboardCompanion/Fonts/SpaceGrotesk-Regular.ttf); }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url(../../../LifeDashboardCompanion/Fonts/SpaceGrotesk-Medium.ttf); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(../../../LifeDashboardCompanion/Fonts/SpaceGrotesk-Bold.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #0A0F0D; }
  #stage {
    position: absolute; left: 0; top: 0; height: 2950px; overflow: hidden; transform-origin: 0 0;
    font-family: "Space Grotesk", sans-serif; color: #EEF4F0; background: #0A0F0D;
  }
  svg.pulse { position: absolute; left: 0; top: 0; }

  .text { position: absolute; }
  .text h1 {
    font-weight: 700; line-height: 1.04; letter-spacing: -0.017em; white-space: nowrap;
  }
  .text h1 em { font-style: normal; color: #30B77E; }
  .text p { margin-top: 80px; line-height: 1.28; color: #B9C4BE; }
  .chips { display: flex; gap: 0.5em; margin-top: 1em; }
  .text.center { text-align: center; }
  .text.center .chips { justify-content: center; margin-top: 1.1em; }
  .chips span {
    display: inline-flex; align-items: center; justify-content: center; min-width: 6.6em;
    padding: 0.42em 0.9em; border-radius: 999px; white-space: nowrap; font-size: 1em; font-weight: 500;
    color: #EEF4F0; background: #141C18; border: 4px solid #30B77E;
  }

  .phone { position: absolute; transform-origin: 50% 40%; }
  .phone .body {
    position: relative; width: 100%; height: 100%; border-radius: var(--r);
    background: linear-gradient(135deg, #5A6268 0%, #2A2F33 22%, #1A1D20 50%, #2E3438 78%, #5B6369 100%);
    padding: var(--band);
    box-shadow: 0 70px 140px rgba(0,0,0,0.7), 0 24px 60px rgba(0,0,0,0.6);
  }
  .phone .bezel { width: 100%; height: 100%; border-radius: calc(var(--r) - var(--band)); background: #000; padding: var(--bezel); }
  .phone .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background-size: 100% 100%; background-repeat: no-repeat;
  }
  .phone .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 999px; }
  .phone .btn { position: absolute; width: 9px; border-radius: 4px; background: linear-gradient(90deg, #22272A, #5A6268); }
  .phone.back .screen::after { content: ""; position: absolute; inset: 0; background: rgba(10,15,13,0.28); }


  .badge {
    position: absolute; display: flex; align-items: center; gap: 30px;
    padding: 36px 56px 36px 40px; border-radius: 999px; white-space: nowrap;
    background: #30B77E; color: #06130D; box-shadow: 0 40px 90px rgba(0,0,0,0.6);
  }
  .badge b { display: block; font-size: 70px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
  .badge small { display: block; margin-top: 10px; font-size: 38px; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <svg class="pulse" id="pulse" height="2950"><path id="beat" fill="none" stroke="#30B77E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="items"></div>
</div>

<script>
const [W, H] = (new URLSearchParams(location.search).get("size") || "5244x2950").split("x").map(Number);
const D = 2950, DW = Math.round(W * D / H), s = H / D;
const LANG = new URLSearchParams(location.search).get("lang") || "en";
const STORE = "../../../store-assets/", RAW = LANG === "en" ? STORE + "raw/" : `${STORE}raw/${LANG}/`;
// The words per language; nl and de follow docs/localization.md ("je", "du").
const T = {
  en: { wide: "Health data to<br>Home Assistant<br><em>or your own server</em>", sub: "No account, no cloud in between.", head: "Your health data,<br><em>on your own server</em>", signed: "Signed" },
  nl: { wide: "Gezondheidsdata naar<br>Home Assistant<br><em>of je eigen server</em>", sub: "Geen account, geen cloud ertussen.", head: "Je gezondheidsdata,<br><em>op je eigen server</em>", signed: "Ondertekend" },
  de: { wide: "Gesundheitsdaten an<br>Home Assistant<br><em>oder deinen Server</em>", sub: "Kein Konto, keine Cloud dazwischen.", head: "Deine Gesundheitsdaten,<br><em>auf deinem Server</em>", signed: "Signiert", scale: 0.86 },
}[LANG];
// The safe area: 6 percent in from every edge, in design pixels.
const MX = Math.round(DW * 0.06), MY = Math.round(D * 0.06);

document.documentElement.style.width = document.body.style.width = W + "px";
document.documentElement.style.height = document.body.style.height = H + "px";
const stage = document.getElementById("stage");
stage.style.width = DW + "px";
stage.style.transform = `scale(${s})`;

// The heartbeat of the design at 3x, low across the whole width: one beat under the text of the
// search asset, one in the middle of the header, under the chips.
(function () {
  const svg = document.getElementById("pulse");
  svg.setAttribute("width", DW);
  svg.setAttribute("viewBox", `0 0 ${DW} ${D}`);
  const y = 2330, x = Math.round(DW * (DW / D < 1.6 ? 0.36 : 0.5)) - 75;
  document.getElementById("beat").setAttribute("d", `M -20 ${y} H ${x} l 33 -78 l 51 156 l 45 -114 l 21 36 H ${DW + 20}`);
})();

function phone(src, x, y, w, transform = "", z = 2, cls = "") {
  const band = Math.round(w * 0.016), bezel = Math.round(w * 0.022);
  const sw = w - 2 * band - 2 * bezel, sh = Math.round(sw * 2868 / 1320);
  const h = sh + 2 * band + 2 * bezel, r = Math.round(w * 0.15), k = sw / 1320;
  const island = `<div class="island" style="top:${Math.round(33 * k)}px;width:${Math.round(378 * k)}px;height:${Math.round(111 * k)}px"></div>`;
  const btns = `<div class="btn" style="left:-7px;top:${Math.round(h * 0.2)}px;height:${Math.round(h * 0.04)}px"></div>` +
    `<div class="btn" style="left:-7px;top:${Math.round(h * 0.27)}px;height:${Math.round(h * 0.075)}px"></div>` +
    `<div class="btn" style="left:-7px;top:${Math.round(h * 0.37)}px;height:${Math.round(h * 0.075)}px"></div>` +
    `<div class="btn" style="right:-7px;top:${Math.round(h * 0.3)}px;height:${Math.round(h * 0.11)}px"></div>`;
  return `<div class="phone ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:${transform};z-index:${z};` +
    `--r:${r}px;--band:${band}px;--bezel:${bezel}px">${btns}<div class="body"><div class="bezel">` +
    `<div class="screen" style="background-image:url(${src})">${island}</div></div></div></div>`;
}
const tilt = (rz, ry = 0) => `perspective(3600px) rotateY(${ry}deg) rotate(${rz}deg)`;
const shield = `<svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#06130D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.3 12.2l2.6 2.6 4.9-5.2"/></svg>`;

// Search (3:2): one short, obvious line and one phone. Header (16:9 and wider): the broad
// idea, the three ways out, two phones and one card. The wider a banner, the smaller it is
// shown for the same width, so its headline is larger.
const search = DW / D < 1.6, wide = DW / D > 2;
const items = [];
const chips = `<div class="chips">` + ["Home Assistant", "MQTT", "Webhooks"].map(t => `<span>${t}</span>`).join("") + `</div>`;
if (search) {
  items.push(`<div class="text" style="left:${MX + 30}px;top:0;height:${D}px;display:flex;flex-direction:column;justify-content:center">` +
    `<h1 style="font-size:270px">${T.wide}</h1>` +
    `<p style="font-size:104px">${T.sub}</p></div>`);
  const right = DW - MX - 40, pw = 1000;
  items.push(phone(RAW + "health.png", right - pw, 360, pw, tilt(-4, -8), 4));
} else {
  // The product page crops the header: an iPhone shows about the middle half of the width,
  // and every device only the top 58 percent above the app's name card; on iPad a navigation
  // pill floats over the top 12 percent. So the headline is centred in the band from 25 to
  // 55 percent of the height and the middle half of the width, the chips sit small right
  // under it, and the phones are decoration at the sides, free to be cropped.
  const h1 = Math.round((wide ? 270 : 230) * (T.scale || 1)), sub = wide ? 68 : 62, cx = DW / 2;
  items.push(`<div class="text center" style="left:${cx - DW * 0.25}px;width:${DW * 0.5}px;top:${Math.round(D * (wide ? 0.27 : 0.285))}px;z-index:8">` +
    `<h1 style="font-size:${h1}px">${T.head}</h1>` +
    `<div style="font-size:${sub}px">${chips}</div></div>`);
  const pw = 1000, side = Math.round(DW * (wide ? 0.13 : 0.06));
  items.push(phone(RAW + "logs.png", side, 430, pw, tilt(9, 16), 3, "back"));
  items.push(phone(RAW + "health.png", DW - side - pw, 430, pw, tilt(-9, -16), 3, "back"));
  items.push(`<div class="badge" style="left:${DW - side - pw + 110}px;top:1700px;transform:rotate(-5deg);z-index:7">${shield}<div><b>${T.signed}</b><small>HMAC-SHA256</small></div></div>`);
}

document.getElementById("items").innerHTML = items.join("");
</script>
</body>
</html>
