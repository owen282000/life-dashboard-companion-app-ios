<!DOCTYPE html>
<!-- The six rendered panels side by side, for a quick review. render.sh renders it to
     contact-sheet.png (English) and contact-sheet-<lang>.png at 2196x797. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2196px; height: 797px; overflow: hidden; background: #E9ECEB; }
  .row { display: flex; gap: 24px; padding: 40px 48px; }
  img { width: 330px; height: 717px; border-radius: 26px; display: block;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
</style>
</head>
<body>
<div class="row">
  <img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt="">
</div>
<script>
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.querySelectorAll("img").forEach((img, n) => { img.src = `${lang}-${n + 1}.png`; });
</script>
</body>
</html>
