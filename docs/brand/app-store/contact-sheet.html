<!DOCTYPE html>
<!-- The six rendered panels (en-1.png to en-6.png) side by side, for a quick review. render.sh
     renders it to contact-sheet.png at 2196x797, and with ?lang=nl or ?lang=de the Dutch and
     German panels to contact-sheet-nl.png and contact-sheet-de.png. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2196px; height: 797px; overflow: hidden; background: #E9ECEB; }
  .row { display: flex; gap: 24px; padding: 40px 48px; }
  img { width: 330px; height: 717px; border-radius: 26px; display: block;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
</style>
</head>
<body>
<div class="row">
  <img src="en-1.png" alt=""><img src="en-2.png" alt=""><img src="en-3.png" alt="">
  <img src="en-4.png" alt=""><img src="en-5.png" alt=""><img src="en-6.png" alt="">
</div>
<script>
const lang = new URLSearchParams(location.search).get("lang");
if (["nl", "de"].includes(lang)) {
  document.querySelectorAll("img").forEach((img, n) => { img.src = `${lang}-${n + 1}.png`; });
}
</script>
</body>
</html>
