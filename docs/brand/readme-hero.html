<!DOCTYPE html>
<!--
  Source for docs/readme-hero.png and docs/readme-hero-phone.png, the first image in the
  README: the iPhone app next to what it feeds in Home Assistant, in the style of the App
  Store screenshots (docs/brand/app-store/panorama.html): the dark green ground, the grid,
  the heartbeat line, a phone frame and floating cards. Drawn at twice the size it is shown
  at: 900 px wide on a desktop, and the ?phone version for screens up to 600 px wide.

  The phone shows a capture from docs/brand/app-store/raw/ (scripts/store-screenshots.sh).
  The Home Assistant cards are the Life Dashboard integration's example dashboard
  (docs/brand/app-store/ha/, from life-dashboard-ha): health cards only, since an
  iPhone sends no screen time. Render from the repository root:

    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    SRC="file://$PWD/docs/brand/readme-hero.html"
    "$CHROME" --headless=new --screenshot=docs/readme-hero.png --window-size=1800,1000 \
      --hide-scrollbars --force-device-scale-factor=1 --default-background-color=00000000 "$SRC"
    "$CHROME" --headless=new --screenshot=docs/readme-hero-phone.png --window-size=1000,1700 \
      --hide-scrollbars --force-device-scale-factor=1 --default-background-color=00000000 "$SRC?phone"
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: transparent; }
  .card {
    position: absolute; inset: 0; border-radius: 40px; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff;
    background:
      radial-gradient(700px 600px at 22% 55%, rgba(48,183,126,0.20), transparent 70%),
      radial-gradient(900px 700px at 70% 40%, rgba(48,183,126,0.10), transparent 70%),
      linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.3) 100%),
      linear-gradient(90deg, #11221D 0%, #0E1B18 40%, #101C1C 70%, #0F1D19 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(48,183,126,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,183,126,0.055) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, black 50%, rgba(0,0,0,0.5) 100%);
  }
  svg.pulse { position: absolute; left: 0; top: 0; }

  .phone { position: absolute; transform-origin: 50% 40%; }
  .phone .body {
    position: relative; width: 100%; height: 100%; border-radius: var(--r);
    background: linear-gradient(135deg, #5A6268 0%, #2A2F33 22%, #1A1D20 50%, #2E3438 78%, #5B6369 100%);
    padding: var(--band);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 14px 34px rgba(0,0,0,0.5), 0 0 110px rgba(48,183,126,0.2);
  }
  .phone .bezel { width: 100%; height: 100%; border-radius: calc(var(--r) - var(--band)); background: #000; padding: var(--bezel); }
  .phone .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background-size: 100% 100%; background-repeat: no-repeat;
  }
  .phone .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 999px; }
  .phone .btn { position: absolute; width: 5px; border-radius: 3px; background: linear-gradient(90deg, #22272A, #5A6268); }
  .phone .glare {
    position: absolute; inset: 0; border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background: linear-gradient(115deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 32%);
  }

  .float { position: absolute; }
  .float .frame {
    border-radius: 26px; overflow: hidden; background: #111;
    border: 2px solid rgba(255,255,255,0.14);
    box-shadow: 0 36px 80px rgba(0,0,0,0.6), 0 0 0 10px rgba(0,0,0,0.12);
  }
  .label {
    display: inline-flex; align-items: center; gap: 12px; margin-bottom: 16px;
    padding: 12px 24px; border-radius: 999px; white-space: nowrap;
    font-size: 30px; font-weight: 700; color: #DDE7E3;
    background: rgba(10,18,16,0.86); border: 2px solid rgba(255,255,255,0.14);
    box-shadow: 0 14px 36px rgba(0,0,0,0.45);
  }
  .label i { width: 16px; height: 16px; border-radius: 50%; background: var(--dot, #41BDF5); display: inline-block; }
  .board { display: grid; gap: 14px; padding: 14px; background: #111; }
  .crop { background-repeat: no-repeat; border-radius: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <svg class="pulse" id="pulse"><path id="beat" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="items"></div>
</div>
<script>
const phoneLayout = location.search.includes("phone");
const [W, H] = phoneLayout ? [1000, 1700] : [1800, 1000];
document.documentElement.style.width = document.body.style.width = W + "px";
document.documentElement.style.height = document.body.style.height = H + "px";
const RAW = "app-store/raw/", HA = "app-store/ha/";

function phone(src, x, y, w, transform = "", z = 2) {
  const band = Math.round(w * 0.016), bezel = Math.round(w * 0.022);
  const sw = w - 2 * band - 2 * bezel, sh = Math.round(sw * 2868 / 1320);
  const h = sh + 2 * band + 2 * bezel, r = Math.round(w * 0.15), k = sw / 1320;
  const island = `<div class="island" style="top:${Math.round(33 * k)}px;width:${Math.round(378 * k)}px;height:${Math.round(111 * k)}px"></div>`;
  const btns = `<div class="btn" style="left:-4px;top:${Math.round(h * 0.2)}px;height:${Math.round(h * 0.04)}px"></div>` +
    `<div class="btn" style="left:-4px;top:${Math.round(h * 0.27)}px;height:${Math.round(h * 0.075)}px"></div>` +
    `<div class="btn" style="left:-4px;top:${Math.round(h * 0.37)}px;height:${Math.round(h * 0.075)}px"></div>` +
    `<div class="btn" style="right:-4px;top:${Math.round(h * 0.3)}px;height:${Math.round(h * 0.11)}px"></div>`;
  return `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:${transform};z-index:${z};` +
    `--r:${r}px;--band:${band}px;--bezel:${bezel}px">${btns}<div class="body"><div class="bezel">` +
    `<div class="screen" style="background-image:url(${src})">${island}<div class="glare"></div></div></div></div></div>`;
}
// A crop of an image: rect [x, y, w, h] in its pixels, shown `width` wide.
function crop(src, srcW, rect, width) {
  const [x, y, w, h] = rect, k = width / w;
  return `<div class="crop" style="width:${width}px;height:${Math.round(h * k)}px;background-image:url(${src});` +
    `background-size:${Math.round(srcW * k)}px auto;background-position:${-Math.round(x * k)}px ${-Math.round(y * k)}px"></div>`;
}
function float(html, x, y, { label, rotate = 0, z = 5, transform = "" } = {}) {
  return `<div class="float" style="left:${x}px;top:${y}px;transform:${transform || `rotate(${rotate}deg)`};z-index:${z}">` +
    (label ? `<div class="label"><i></i>${label}</div>` : "") + `<div class="frame">${html}</div></div>`;
}
const tilt = (rz, ry = 0) => `perspective(2400px) rotateY(${ry}deg) rotate(${rz}deg)`;

// Home Assistant's cards, from the integration's example dashboard: health only.
const DASH = HA + "dashboard.png";
const steps = (w) => crop(DASH, 2480, [64, 115, 366, 112], w);
const distance = (w) => crop(DASH, 2480, [444, 115, 360, 112], w);
const heart = (w) => crop(DASH, 2480, [64, 372, 366, 110], w);
const sleep = (w) => crop(DASH, 2480, [444, 372, 360, 110], w);
const stepsWeek = (w) => crop(DASH, 2480, [1676, 115, 738, 555], w);
const heartDay = (w) => crop(DASH, 2480, [1676, 688, 738, 552], w);

// The heartbeat runs from the phone into Home Assistant.
function pulse(y, beats) {
  const svg = document.getElementById("pulse");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let d = `M -10 ${y}`;
  for (const x of beats) d += ` L ${x - 70} ${y} L ${x - 45} ${y - 80} L ${x - 10} ${y + 110} L ${x + 20} ${y - 35} L ${x + 45} ${y}`;
  d += ` L ${W + 10} ${y}`;
  svg.insertAdjacentHTML("afterbegin", `<defs>
    <filter id="glow" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#30B77E" stop-opacity="0.15"/><stop offset="0.45" stop-color="#30B77E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#30B77E" stop-opacity="0.15"/></linearGradient></defs>`);
  const beat = document.getElementById("beat");
  beat.setAttribute("d", d); beat.setAttribute("stroke", "url(#fade)"); beat.setAttribute("filter", "url(#glow)");
}

const items = [];
if (!phoneLayout) {
  pulse(800, [620]);
  items.push(phone(RAW + "health.png", 150, 50, 420, tilt(-4, 10), 3));
  const board = `<div class="board" style="grid-template-columns:repeat(2, 440px)">` +
    steps(440) + distance(440) + heart(440) + sleep(440) + stepsWeek(440) + heartDay(440) + `</div>`;
  items.push(float(board, 760, 110, { label: "Home Assistant", transform: "perspective(2400px) rotateY(-9deg) rotate(1deg)" }));
} else {
  pulse(1000, [520]);
  items.push(phone(RAW + "health.png", 70, 60, 440, tilt(-5, 10), 3));
  items.push(float(`<div class="board">` + steps(380) + heart(380) + `</div>`,
    560, 250, { label: "Home Assistant", rotate: 3 }));
  items.push(float(`<div class="board">` + stepsWeek(780) + `</div>`,
    110, 1040, { rotate: -1.5 }));
}
document.getElementById("items").innerHTML = items.join("");
</script>
</body>
</html>
