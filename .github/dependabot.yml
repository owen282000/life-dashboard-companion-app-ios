version: 2
updates:
  # Keeps the SHA-pinned workflow actions up to date (pins never move on their own)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Every github/codeql-action step must run the same version, or CodeQL fails;
      # one pull request moves init, analyze and upload-sarif together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
