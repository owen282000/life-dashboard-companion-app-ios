name: Build

on:
  push:
    branches: [main]
  # Every pull request, whatever branch it targets, so a stacked branch is checked too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  build:
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned, not the image default: the translation check reads what this Xcode's compiler
      # extracts. Move it on purpose, after scripts/l10n.sh check passes on the new version.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Build app (unsigned, simulator SDK)
        run: |
          xcodebuild \
            -project LifeDashboardCompanion.xcodeproj \
            -target LifeDashboardCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build for testing
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          echo "DESTINATION=platform=iOS Simulator,name=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild \
            -project LifeDashboardCompanion.xcodeproj \
            -scheme LifeDashboardCompanion \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      # The tests read English text, whatever language the runner is in.
      - name: Run unit tests
        run: |
          xcodebuild \
            -project LifeDashboardCompanion.xcodeproj \
            -scheme LifeDashboardCompanion \
            -destination "$DESTINATION" \
            -derivedDataPath build/tests \
            -testLanguage en -testRegion US \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Upload simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: simulator-app
          path: build/Debug-iphonesimulator/LifeDashboardCompanion.app
          retention-days: 30
