name: CodeQL

# Every pull request and a weekly run on main. A push to main is the pull request that was just
# analysed, so it is not analysed a second time. Pull requests that change only documentation are
# analysed too: OpenSSF Scorecard counts a merged commit without a CodeQL run as unchecked.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual

      - name: Build app for analysis
        run: |
          xcodebuild \
            -project LifeDashboardCompanion.xcodeproj \
            -target LifeDashboardCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:swift"
