name: Bug report
description: Something is broken or not working as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable data type X
        2. Tap Sync Now
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.1.0 (see the About tab)"
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version and device
      placeholder: "iOS 26.1, iPhone 17 Pro Max"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant webhook logs
      description: Expand the failing entry in the Logs tab. Remove or redact your webhook URL and any personal health data before pasting.
